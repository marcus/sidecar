version: 2

builds:
  - main: ./cmd/sidecar
    binary: sidecar
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.Commit={{ .ShortCommit }} -X main.Dirty=false -X main.BuildDate={{ .Date }} -X main.BuildProfile=release
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Note: GoReleaser does NOT publish the Homebrew formula (there is intentionally
# no `brews:` block). Formula/sidecar.rb in marcus/homebrew-tap builds from
# source (to avoid Gatekeeper warnings on macOS) and is bumped automatically by
# the separate `update-homebrew-tap` job in .github/workflows/release.yml, which
# rewrites the tag URL and source-tarball sha256 after each tagged build. The td
# and nightshift formulas are NOT touched by that job — bump them by hand when
# co-releasing.
