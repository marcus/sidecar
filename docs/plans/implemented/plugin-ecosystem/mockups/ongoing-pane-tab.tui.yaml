# ==============================================================================
# TUI STUDIO MOCKUP SPECIFICATION
# ==============================================================================
# WHAT THIS IS:
# This file defines a high-fidelity Terminal User Interface (TUI) layout mockup.
# It compiles directly into a deterministic 2D terminal character grid.
# ==============================================================================
# Plugin ecosystem M0: the Panes placement. A protocol plugin (ongoing) shows a
# collection tab in the shared Resource leaf beside a live terminal, opened by
#   sidecar open --plugin ongoing --collection projects --split right
# The leaf is narrow, so the table reflows to primary/secondary rows and the
# detail opens as a second tab in the same leaf instead of a side box.
# ==============================================================================

title: "Ongoing collection tab in a Resource leaf"
viewport:
  cols: 160
  rows: 45
theme: "sidecar-modern"

states:
  - name: "Collection tab beside a terminal"
    layout:
      type: vertical
      children:
        # Sidecar's own top bar (internal/app/view.go headerGeometry).
        - type: sidecar_header
          global_tabs: ["Sessions", "Activity", "Recall"]
          project_tabs: ["Files", "Git", "Workspaces", "Notes"]
          active_project: "Workspaces"
          project: "sidecar"
        - type: horizontal
          flex: 1
          children:
            - type: pane
              width: 28
              title: "Workspaces"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: normal
              content:
                # One blank row under the title row.
                - text: ""
                - list:
                    selected_index: 1
                    cursor: "❯ "
                    items:
                      - { text: "main", badge: "●", badge_style: "fg:green" }
                      - { text: "plugin-eco…", badge: "agent" }
                      - { text: "remote-git", badge: "idle" }
            - type: sidecar_rail
            - type: pane
              flex: 1
              title: "plugin-ecosystem · claude"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: active
              content:
                # One blank row under the title row.
                - text: ""
                - text: "[fg:green]›[/fg] sidecar open --plugin ongoing --collection projects --split right"
                - text: "[dim]opened  resource  ongoing/projects  at 2.2[/dim]"
                - text: ""
                - text: "[fg:green]›[/fg] sidecar open --plugin ongoing --collection projects recall"
                - text: "[dim]opened  resource  ongoing/projects/recall  at 2.2 (tab 2)[/dim]"
                - text: ""
                - text: "[fg:green]›[/fg] [reverse] [/reverse]"
            - type: sidecar_rail
            - type: pane
              width: 52
              # A Resource leaf has no title of its own: its header row IS the
              # tab strip (internal/tabs/strip.go, internal/ui/header_close.go).
              padding: [0, 1]
              border: rounded
              border_gradient: normal
              content:
                - tabs:
                    sidecar: true
                    close: true
                    items: ["Projects", "recall"]
                    active: 0
                # One blank row between the header row — here the tab strip —
                # and the first content row.
                - text: ""
                # A Resource leaf has no header row free for the View control,
                # so the sort pill sits at the right end of the row under it.
                # styles.Button, two columns of padding; pressing it — or v —
                # opens the View modal, where sort and the filters both live.
                #
                # At 52 columns the view rows and the full "⇅ commits" label
                # cannot both be drawn, so the pill sheds its word and keeps its
                # glyph — sidebar.go headerAttempts, second rung. The control is
                # still there to press and the sort still has a name inside the
                # modal; only the header caption goes.
                - bar:
                    left: "[bg:accent fg:on-accent bold] Attention [/bg] [dim]Rising  Momentum  Dormant[/dim]"
                    right: "[bg:surface0 fg:subtext]  ⇅  [/bg]"
                - divider: ""
                - text: "[bg:surface0 fg:accent bold]❯[/bg][bg:surface0 fg:selection-fg] recall                      [/bg][bg:surface0 fg:warning]warn[/bg][bg:surface0 fg:selection-fg]  41 · 3d [/bg]"
                - text: " [dim]retrieval over user-controlled sources[/dim]"
                - text: " sidecar                       [fg:green]ok[/fg]    88 · 2h"
                - text: " [dim]terminal workspace for agents[/dim]"
                - text: " dex                           [fg:yellow]warn[/fg]  12 · 9d"
                - text: " [dim]agent-native people database[/dim]"
                - text: " td                            [fg:green]ok[/fg]    27 · 1d"
                - text: " [dim]task tracker with review gates[/dim]"
                - text: " ongoing                       [fg:red]stale[/fg] 3 · 6w"
                - text: " [dim]projects dashboard[/dim]"
                - divider: ""
                - text: "[dim]12 projects · scanned 14m ago[/dim]"
        - type: sidecar_footer
          keys:
            - { key: "j/k", label: "Move" }
            - { key: "Enter", label: "Open" }
            - { key: "v", label: "View" }
            - { key: "r", label: "Refresh" }
            - { key: "a", label: "Actions" }
            - { key: "n", label: "Pane" }
            - { key: "x", label: "Close" }
          status: "2.2 · resource "
