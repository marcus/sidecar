                      - ["mail", "[badge:yellow:black:warn]", "yes · 780ms", "9,610"]
                      - ["shell", "[badge:green:black:ok]", "yes · 12ms", "22,470"]
                      - ["td", "[badge:green:black:ok]", "yes · 9ms", "613"]
                - divider: ""
                - text: "[dim]Every eligible source answered, so the empty[/dim]"
                - text: "[dim]list is an answer and not a gap. A source that[/dim]"
                - text: "[dim]had failed would be named here instead, and[/dim]"
                - text: "[dim]the outcome would read[/dim] [fg:yellow]degraded[/fg][dim].[/dim]"
                - divider: "Suppressed"
                - text: "[dim]0 below the relevance floor[/dim]"
                - text: "[dim]0 dropped by the result budget[/dim]"
        # The footer is styles.KeyHint chips and their labels, two columns
        # between pairs, drawn whole or dropped — view.go renderHintLineTruncated.
        - type: sidecar_footer
          keys:
            - { key: "j/k", label: "Move" }
            - { key: "Enter", label: "Open" }
            - { key: "/", label: "Query" }
            - { key: "v", label: "View" }
            - { key: "r", label: "Refresh" }
            - { key: "a", label: "Actions" }
            - { key: "o", label: "Source" }
            - { key: "n", label: "Pane" }
            - { key: "Tab", label: "Focus" }
          status: "recall · results · abstained "

  # ==========================================================================
  # 5. Sort and scope are one surface, and it is the host's: the View modal the
  #    global Workspaces (Sessions) list opens on `v`
  #    (internal/overview/view_flyout.go). recall declared sort keys and four
  #    typed scope inputs; the host put both inside the one modal its own lists
  #    already use, so a plugin cannot invent a second way to reorder a list.
  # ==========================================================================
  - name: "Scope picker"
    notes:
      - "Same construction as internal/overview/view_flyout.go: a Current sort line, a spacer, the sort list, a spacer, the filter checkboxes, a spacer, Done."
      - "The affordance is the sort pill on the list pane's header row, the place workspacelist.SortPillLabel puts it."
      - "Applied filters are folded into the pill's label; the list-row grammar has no chip line to spend on them."
    layout:
      type: vertical
      children:
        # Sidecar's own top bar, not an approximation of one: the studio's
        # sidecar_header transcribes internal/app/view.go headerGeometry. Global
        # destinations sit left of the divider, project tabs right of it, and
        # the selector pill, unread indicator and gear are pinned to the right
        # edge in that order. Same destinations and same active one as before —
        # only the chrome changed.
        - type: sidecar_header
          global_tabs: ["Sessions", "Activity", "Recall"]
          active_global: "Recall"
          project_tabs: ["Files", "Git", "Workspaces", "Notes"]
          project: "sidecar"
        - type: horizontal
          flex: 1
          children:
            - type: pane
              width: 98
              title: "Recall · Results"
              # The View control, exactly where the real one sits: the sort pill
              # on the list pane's header row, right-aligned, drawn with
              # styles.Button (workspacelist.SortPillLabel through
              # sidebar.go renderControl). Pressing it — or v — opens the View
              # modal, which is where sort and the scope filters both live.
              # Applied filters are folded into the label rather than spent on a
              # chip line the list-row grammar has no room for.
              title_right: "[bg:surface0 fg:subtext]  ⇅ rank · 3 filters  [/bg]"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: active
              content:
                # One blank row between the title row and the first content row.
                - text: ""
                - bar:
                    left: "[fg:accent]/[/fg] [bold]dex[/bold]"
                    right: "[dim]26 of 31[/dim]  [badge:green:black:answered]"
                # The query bar owns its row, and one blank row of padding
                # separates it from whatever comes next.
                - text: ""
                - table:
                    indent: 0
                    headers: ["#", "TITLE", "SOURCE", "EXCERPT", ""]
                    widths: [3, 27, 8, 32, 16]
                    alignments: ["right", "left", "left", "left", "left"]
                    selected_row: 0
                    rows:
                      - ["1", "DEX schema notes", "notes", "› people are tiered, and the…", "[badge:green:black:exact]"]
                      - ["2", "dex context --json", "shell", "› dumps every field the brief…", "[badge:blue:black:corroborated 3]"]
                      - ["3", "People database, first cut", "notes", "› handles, aliases, links, and…", ""]
                      - ["4", "td-3fa2c1 Import people.md", "td", "› import from people.md keeps…", "[badge:blue:black:corroborated 2]"]
                      - ["5", "Weekly review 2026-08-18", "notes", "› promote three contacts to…", ""]
                      - ["6", "dex brief for session boot", "shell", "› inner circle first, then the…", ""]
                      - ["7", "Re: dex trial accounts", "mail", "› the trial list you asked for…", ""]
                      - ["8", "Handles and phone numbers", "notes", "› one phone per handle kind…", ""]
                      - ["9", "td-9c04ab dex stale rules", "td", "› stale should read tier, not…", ""]
                      - ["10", "dex merge --dry-run", "shell", "› keeps the first person and…", ""]
                      - ["11", "Tier promotion policy", "notes", "› demotion is explicit, never…", ""]
                      - ["12", "Fwd: conference contacts", "mail", "~ Thanks — attaching the list…", ""]
                      - ["13", "td-51b7e0 dex brief budget", "td", "› the brief has a token budget…", ""]
                      - ["14", "dex stale --tier inner", "shell", "› lists overdue people only in…", ""]
                      - ["15", "Retrieval eval pack notes", "notes", "~ The eval pack covers recall…", ""]
                      - ["16", "dex import --format md", "shell", "› the importer is idempotent…", ""]
                      - ["17", "Meeting notes 2026-08-22", "notes", "› agreed dex owns identity, td…", ""]
                      - ["18", "td-77aa19 dex export", "td", "› export must round-trip the…", ""]
                      - ["19", "Re: people.md format", "mail", "~ Attached is the format we…", ""]
                      - ["20", "dex link add --kind repo", "shell", "› links hang off the person…", ""]
                      - ["21", "Re: dex and td identity", "mail", "~ If dex owns the person then…", ""]
                      - ["22", "dex tier --set inner", "shell", "› promotion is one command, and…", ""]
                      - ["23", "td-2ef880 dex tier audit", "td", "› audit which tiers changed in…", ""]
                      - ["24", "Contacts import checklist", "notes", "› export, dedupe, then import…", ""]
                      - ["25", "dex stale --json", "shell", "› the same rows the brief hid…", ""]
                      - ["26", "Re: people.md format v2", "mail", "~ Second pass at the format we…", ""]
                - divider: ""
                - bar:
                    left: "[dim]26 of 31 shown · the rest load on scroll[/dim]"
                    right: "[dim]› matched span   ~ record opening[/dim]"
            - type: sidecar_rail
            - type: pane
              flex: 1
              title: "DEX schema notes"
              title_right: "[badge:green:black:exact]"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: normal
              content:
                # One blank row under the title row.
                - text: ""
                - text: "[dim]notes · 2026-08-14[/dim]"
                - text: ""
                - text: "[dim]Source[/dim]        notes"
                - text: "[dim]Locator[/dim]       rc:notes:2026-08-14-dex-design"
                - text: "[dim]Updated[/dim]       2 weeks ago"
                - text: "[dim]Corroborated[/dim]  2 records · shell, td"
                - divider: "Evidence"
                - text: "[bold]Tiers[/bold]"
                - text: "People are tiered. The tier drives what [bold]brief[/bold] shows at"
                - text: "session boot, and what [bold]stale[/bold] treats as overdue."
        - type: sidecar_footer
          keys:
            - { key: "j/k", label: "Move" }
            - { key: "Enter", label: "Select" }
            - { key: "Space", label: "Toggle" }
            - { key: "Esc", label: "Done" }
          status: "recall · view "
    modals:
      # Sidecar's modal chrome, from internal/styles/styles.go: ModalBox is a
      # rounded border in Primary over the BgSecondary surface with Padding(1, 2)
      # and no drop shadow, and ModalTitle is bold primary text inside the box
      # with one blank row under it. The border line stays unbroken here too.
      #
      # The sections are the View flyout's, in its order
      # (internal/overview/view_flyout.go ensureViewFlyout): a Current sort line,
      # a spacer, the sort list, a spacer, the checkboxes, a spacer, Done. The
      # sort list draws modal.List — styles.ListCursor's filled cursor on the
      # selected row and styles.ListItemFocused's fill behind its label — and
      # each checkbox is styles.Button, two columns of padding, ragged to its
      # own label. modal.WithHints(false) means the modal carries no hint line;
      # the footer already says what the keys do.
      - width: 44
        height: 19
        border: rounded
        border_style: "fg:accent"
        background: "surface"
        shadow: false
        content:
          - text: ""
          - text: "  [bold]View · Results[/bold]"
          - text: ""
          - text: " Current sort: rank"
          - text: ""
          - text: " [fg:accent bold]▸ [/fg][bg:accent fg:on-accent]rank[/bg]"
          - text: "   source"
          - text: "   updated"
          - text: "   corroborated"
          - text: ""
          # modal.Checkbox draws [ ] and [x]; the studio's markup parser eats a
          # bracketed token, so the boxes are ( ) and (x) here. Everything else
          # about them is the real control: styles.Button, two columns of
          # padding, ragged to its own label, unchecked meaning the key is not
          # sent at all.
          - text: " [bg:surface0 fg:subtext]  ( ) source · any  [/bg]"
          - text: " [bg:surface0 fg:subtext]  (x) type · note  [/bg]"
          - text: " [bg:surface0 fg:subtext]  (x) project · sidecar  [/bg]"
          - text: " [bg:surface0 fg:subtext]  (x) since · 2026-08-01  [/bg]"
          - text: ""
          - text: " [bg:surface0 fg:subtext]   Done   [/bg]"

