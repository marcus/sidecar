# ==============================================================================
# TUI STUDIO MOCKUP SPECIFICATION
# ==============================================================================
# WHAT THIS IS:
# This file defines a high-fidelity Terminal User Interface (TUI) layout mockup.
# It compiles directly into a deterministic 2D terminal character grid.
# ==============================================================================
# Plugin ecosystem M0 — recall as a protocol plugin, end to end.
#
# recall sent DATA ONLY: a `results` collection (columns, sort keys), a
# `sources` collection, resources with fields/body/sections/timeline, one
# `scope` action with typed inputs, notices, and an outcome
# (answered | abstained | degraded). Nothing below was drawn by the plugin.
#
# Sidecar owns every affordance on screen: the navbar and its number keys, the
# query line, the cursor, the selection highlight, the status pills, the field
# grid, the section rules, the reflow at narrow widths, the View control and the
# modal behind it, the pane frame, and the whole footer.
# ==============================================================================

title: "Recall studio · one protocol plugin, six host renderings"
viewport:
  cols: 160
  rows: 45
theme: "sidecar-modern"

states:
  # ==========================================================================
  # 1. No query yet. `results` declares search: required, so the host answers
  #    an empty query itself and never calls the plugin. The `sources`
  #    collection fills the detail box, because there is no resource open.
  # ==========================================================================
  - name: "Empty query"
    notes:
      - "search: required means an empty query is answered by the host, not the plugin."
      - "With no resource open, the detail box shows the plugin's other collection."
    layout:
      type: vertical
      children:
        # Sidecar's own top bar, not an approximation of one: the studio's
        # sidecar_header transcribes internal/app/view.go headerGeometry. Global
        # destinations sit left of the divider, project tabs right of it, and
        # the selector pill, unread indicator and gear are pinned to the right
        # edge in that order. Same destinations and same active one as before —
        # only the chrome changed.
        - type: sidecar_header
          global_tabs: ["Sessions", "Activity", "Recall"]
          active_global: "Recall"
          project_tabs: ["Files", "Git", "Workspaces", "Notes"]
          project: "sidecar"
        - type: horizontal
          flex: 1
          children:
            - type: pane
              width: 98
              title: "Recall · Results"
              # The View control, exactly where the real one sits: the sort pill
              # on the list pane's header row, right-aligned, drawn with
              # styles.Button (workspacelist.SortPillLabel through
              # sidebar.go renderControl). Pressing it — or v — opens the View
              # modal, which is where sort and the scope filters both live.
              # Applied filters are folded into the label rather than spent on a
              # chip line the list-row grammar has no room for.
              title_right: "[bg:surface0 fg:subtext]  ⇅ rank · 3 filters  [/bg]"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: active
              content:
                # One blank row between the title row and the first content row.
                - text: ""
                - bar:
                    left: "[fg:accent]/[/fg] [reverse] [/reverse][dim] search notes, mail, shell and td[/dim]"
                    right: "[dim]no query[/dim]"
                # The query bar owns its row, and one blank row of padding
                # separates it from whatever comes next.
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: ""
                - text: "[bold]This collection needs a query.[/bold]"
                  align: center
                - text: ""
                - text: "[dim]recall does not list; it answers. Press [/dim][key:/][dim] to ask.[/dim]"
                  align: center
                - text: ""
                - text: ""
                - text: "[dim]4 sources · profile [/dim][fg:accent]default[/fg][dim] · last refresh 1m ago[/dim]"
                  align: center
            - type: sidecar_rail
            - type: pane
              flex: 1
              title: "Recall · Sources"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: normal
              content:
                # One blank row under the title row.
                - text: ""
                - table:
                    indent: 0
                    headers: ["SOURCE", "HEALTH", "FRESH", "RECORDS"]
                    widths: [14, 12, 12, 13]
                    alignments: ["left", "left", "left", "right"]
                    selected_row: -1
                    rows:
                      - ["notes", "[badge:green:black:ok]", "4m ago", "1,284"]
                      - ["mail", "[badge:yellow:black:warn]", "3d ago", "9,610"]
                      - ["shell", "[badge:green:black:ok]", "1m ago", "22,470"]
                      - ["td", "[badge:green:black:ok]", "12m ago", "613"]
                - divider: ""
                - text: "[fg:yellow]warn[/fg]  [dim]mail checkpoint is 3 days old.[/dim]"
                - text: "      [dim]Records after it are not searchable yet.[/dim]"
                - text: ""
                - text: "[key:a] [dim]offers[/dim] Refresh source [dim]on the row and[/dim]"
                - text: "    Refresh all [dim]on the collection — both are[/dim]"
                - text: "    [dim]plugin actions, confirmed by the host.[/dim]"
                - divider: "Declared"
                - text: "[dim]collections[/dim]  results [dim](search: required)[/dim]"
                - text: "             sources [dim](refresh: 120s)[/dim]"
                - text: "[dim]context[/dim]      project"
                - text: "[dim]matchers[/dim]     rc:<source>:<local>"
                - text: "[dim]actions[/dim]      scope, refresh-source, refresh-all"
        # The footer is styles.KeyHint chips and their labels, two columns
        # between pairs, drawn whole or dropped — view.go renderHintLineTruncated.
        - type: sidecar_footer
          keys:
            - { key: "j/k", label: "Move" }
            - { key: "Enter", label: "Open" }
            - { key: "/", label: "Query" }
            - { key: "v", label: "View" }
            - { key: "r", label: "Refresh" }
            - { key: "a", label: "Actions" }
            - { key: "o", label: "Source" }
            - { key: "n", label: "Pane" }
            - { key: "Tab", label: "Focus" }
          status: "recall · ready "

