# ==============================================================================
# TUI STUDIO MOCKUP SPECIFICATION
# ==============================================================================
# WHAT THIS IS:
# This file defines a high-fidelity Terminal User Interface (TUI) layout mockup.
# It compiles directly into a deterministic 2D terminal character grid.
# ==============================================================================
# Plugin ecosystem M0: a protocol plugin (recall) in a global Tab placement.
# The plugin sent only data (a results collection, a resource with sections);
# every key, pill, cursor, and colour below is Sidecar's.
# ==============================================================================

title: "Recall as a global protocol plugin"
viewport:
  cols: 160
  rows: 45
theme: "sidecar-modern"

states:
  - name: "Results and detail"
    layout:
      type: vertical
      children:
        # Sidecar's own top bar (internal/app/view.go headerGeometry), not an
        # approximation: global destinations left of the divider, project tabs
        # right, then the selector pill, unread indicator and gear.
        - type: sidecar_header
          global_tabs: ["Sessions", "Activity", "Recall"]
          active_global: "Recall"
          project_tabs: ["Files", "Git", "Workspaces", "Notes"]
          project: "sidecar"
        - type: horizontal
          flex: 1
          children:
            - type: pane
              width: 74
              title: "Recall · Results"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: active
              content:
                # One blank row between the title row and the first content row.
                - text: ""
                # The query bar owns its row; the count and the outcome pill sit
                # at its right end, and one blank row of padding separates it
                # from the table.
                - bar:
                    left: "[fg:accent]/[/fg] query: [bold]dex[/bold][reverse] [/reverse]"
                    right: "[dim]7 results ·[/dim] [fg:yellow]degraded[/fg]"
                - text: ""
                - table:
                    headers: ["#", "TITLE", "SOURCE", "EXCERPT"]
                    widths: [3, 26, 9, 26]
                    selected_row: 0
                    rows:
                      - ["1", "DEX schema notes", "notes", "…people are tiered, and the tier…"]
                      - ["2", "dex context --json", "shell", "…the star command; dumps every…"]
                      - ["3", "People database, first cut", "notes", "…handles, aliases, relationships…"]
                      - ["4", "td-3fa2c1 Import people.md", "td", "…import from people.md keeps the…"]
                      - ["5", "Weekly review 2026-08-18", "notes", "…promote three contacts to inner…"]
                      - ["6", "dex brief for session boot", "shell", "…inner circle summary…"]
                      - ["7", "Handles and phone numbers", "notes", "…one phone per handle kind…"]
                - divider: ""
                - text: "[fg:yellow]⚠[/fg] 1 of 4 sources did not answer [dim](mail: checkpoint stale)[/dim]"
            - type: sidecar_rail
            - type: pane
              flex: 1
              title: "DEX schema notes"
              title_right: "[badge:green:black:exact]"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: normal
              content:
                # One blank row under the title row.
                - text: ""
                - text: "[dim]notes · 2026-08-14[/dim]"
                - text: "[dim]Source[/dim]   notes          [dim]Locator[/dim]  rc:notes:2026-08-14-dex-design"
                - text: "[dim]Updated[/dim]  2 weeks ago    [dim]Corroborated[/dim]  2 records"
                - divider: "Evidence"
                - text: "People are tiered. The tier drives what [bold]brief[/bold] shows at session"
                - text: "boot and what [bold]stale[/bold] considers overdue. Promotion and demotion"
                - text: "are explicit commands so an agent never guesses a tier from"
                - text: "interaction counts alone."
                - text: ""
                - text: "Handles, aliases, links, and phones hang off the person; a merge"
                - text: "keeps the first and moves everything attached from the second."
                - divider: "Timeline"
                - text: "[dim]2w ago[/dim]   Note added"
                - text: "[dim]13d ago[/dim]  Linked from [fg:accent]td-3fa2c1[/fg]"
                - text: "[dim]9d ago[/dim]   Corroborated by [fg:accent]rc:shell:dex-context[/fg]"
        # styles.KeyHint chips and their labels, two columns between pairs,
        # drawn whole or dropped (view.go renderHintLineTruncated).
        - type: sidecar_footer
          keys:
            - { key: "j/k", label: "Move" }
            - { key: "Enter", label: "Open" }
            - { key: "/", label: "Query" }
            - { key: "r", label: "Refresh" }
            - { key: "a", label: "Actions" }
            - { key: "o", label: "Source" }
            - { key: "n", label: "Pane" }
            - { key: "Tab", label: "Focus" }
            - { key: "?", label: "Help" }
            - { key: "q", label: "Quit" }

  - name: "Action form"
    layout:
      type: vertical
      children:
        # Sidecar's own top bar (internal/app/view.go headerGeometry), not an
        # approximation: global destinations left of the divider, project tabs
        # right, then the selector pill, unread indicator and gear.
        - type: sidecar_header
          global_tabs: ["Sessions", "Activity", "DEX"]
          active_global: "DEX"
          project_tabs: ["Files", "Git", "Workspaces", "Notes"]
          project: "sidecar"
        - type: horizontal
          flex: 1
          children:
            - type: pane
              width: 74
              title: "DEX · People"
              # The View control, where workspacelist puts it: the sort pill on
              # the list pane's header row, right-aligned, drawn with
              # styles.Button. It opens the View modal, the one place sort and
              # the filters live.
              title_right: "[bg:surface0 fg:subtext]  ⇅ recent  [/bg]"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: active
              content:
                # One blank row between the title row and the first content row.
                - text: ""
                - text: "[bg:accent fg:on-accent bold] Inner [/bg] [dim] Circle   Contacts   Stale [/dim]"
                - divider: ""
                - table:
                    headers: ["NAME", "TIER", "LAST", "NEXT"]
                    widths: [22, 8, 10, 24]
                    selected_row: 1
                    rows:
                      - ["Ada Byron", "inner", "2d ago", "send eval pack"]
                      - ["Grace Hopper", "inner", "9d ago", "coffee, retrieval demo"]
                      - ["Linus Pauling", "inner", "3w ago", "[fg:yellow]stale[/fg] · follow up"]
                      - ["Mary Somerville", "circle", "1d ago", ""]
            - type: sidecar_rail
            - type: pane
              flex: 1
              title: "Grace Hopper"
              title_right: "[badge:accent:black:inner]"
              title_position: inside
              padding: [0, 1]
              border: rounded
              border_gradient: normal
              content:
                # One blank row under the title row.
                - text: ""
                - text: "[dim]Handles[/dim]  @grace · grace@example.test      [dim]Phone[/dim]  +1 555 0100"
                - divider: "Timeline"
                - text: "[dim]9d ago[/dim]   Call · retrieval eval pack review"
                - text: "[dim]3w ago[/dim]   Event · conference dinner"
        - type: sidecar_footer
          keys:
            - { key: "Esc", label: "Cancel" }
            - { key: "Ctrl+Enter", label: "Log note" }
          status: "act · log-note "
    modals:
      # styles.ModalBox / ModalTitle: a rounded Primary border on the
      # BgSecondary surface, Padding(1, 2), no drop shadow, and the title inside
      # the box in bold primary text with a blank row under it.
      - width: 70
        height: 15
        border: rounded
        border_style: "fg:accent"
        background: "surface"
        shadow: false
        content:
          - text: ""
          - text: "  [bold]Log a note · Grace Hopper[/bold]"
          - text: ""
          - text: " [dim]text[/dim] [fg:error]*[/fg]"
          - text: " ┌────────────────────────────────────────────────────────────────┐"
          - text: " │ Met at the retrieval workshop; follow up about the eval pack.  │"
          - text: " │ [reverse] [/reverse]                                                              │"
          - text: " └────────────────────────────────────────────────────────────────┘"
          - text: ""
          - bar:
              center: "[key:Ctrl+Enter] Log note   [key:Esc] Cancel"
